<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>道玄文集 · 后台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%235a3921'>🖋️</text></svg>">
<style>
:root{
  --paper:#f8f4e9; --paper2:#f1e7d2; --ink:#5a3921; --accent:#8b4513;
  --line:rgba(90,57,33,.18); --line2:rgba(90,57,33,.32); --muted:#8a7358;
  --ok:#2f6b4f; --err:#a8322d; --card:#fffdf7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"楷体","STKaiti","Microsoft YaHei",serif; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(160deg,#f8f4e9 0%,#f1e7d2 55%,#e9dcc0 100%);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--ink)}
a{color:var(--accent)}

header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 18px;border-bottom:1px solid var(--line);
  background:rgba(255,253,247,.82);backdrop-filter:blur(4px);
  position:sticky;top:0;z-index:20;
}
header h1{font-size:17px;margin:0;font-weight:500;letter-spacing:1px}
header .sp{flex:1}
.badge{font-size:12px;padding:2px 9px;border:1px solid var(--line2);border-radius:999px;color:var(--muted)}
.btn{
  border:1px solid var(--line2);background:var(--card);color:var(--ink);
  padding:6px 14px;border-radius:6px;font-size:13px;transition:.15s;
}
.btn:hover{background:#fff;border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff8ee}
.btn.primary:hover{background:#7a3c10}
.btn.danger{border-color:#c99;color:var(--err)}
.btn.danger:hover{background:#fdf1f0;border-color:var(--err)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{display:flex;gap:0;height:calc(100vh - 57px);overflow:hidden}

aside{
  width:290px;flex:0 0 290px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;background:rgba(255,253,247,.55);
}
aside .search{padding:10px}
aside .search input{width:100%;padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--card);font-size:13px}
#list{overflow-y:auto;flex:1;margin:0;padding:0 0 20px;list-style:none}
#list li{padding:9px 14px;border-bottom:1px solid rgba(90,57,33,.08);cursor:pointer;font-size:14px;line-height:1.45}
#list li:hover{background:rgba(139,69,19,.06)}
#list li.active{background:rgba(139,69,19,.12);border-left:3px solid var(--accent);padding-left:11px}
#list li .no{color:var(--muted);font-size:12px;margin-right:5px}
#list li small{color:var(--muted);font-size:12px}
#list li .draft{color:#b07b00;font-size:11px;border:1px solid #e0c37a;border-radius:4px;padding:0 4px;margin-left:5px}

section.editor{flex:1;overflow-y:auto;padding:18px 22px 60px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;letter-spacing:.5px}
.field input,.field textarea,.field select{
  width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:6px;
  background:var(--card);font-size:14px;
}
.row{display:flex;gap:12px}
.row .field{flex:1}
textarea#body{
  min-height:46vh;line-height:1.85;font-size:15px;resize:vertical;
  font-family:"Kaiti SC","楷体",Consolas,monospace;
}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.8}
.preview{
  border:1px dashed var(--line2);border-radius:8px;background:var(--card);
  padding:18px 22px;line-height:2;font-size:16px;min-height:200px;
}
.preview p{margin:.6em 0;text-indent:2em}
.preview .poem-line{margin:.15em 0;text-indent:0}
.preview h2,.preview h3{font-weight:500;margin:.8em 0 .4em}
.preview img{max-width:100%}
.preview .note{color:#6b7a6b}

#login{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(248,244,233,.96);z-index:50;
}
#login .box{
  width:330px;background:var(--card);border:1px solid var(--line2);border-radius:12px;
  padding:26px 24px;box-shadow:0 10px 40px rgba(90,57,33,.12);text-align:center;
}
#login h2{font-size:17px;font-weight:500;margin:0 0 6px}
#login p{font-size:12.5px;color:var(--muted);margin:0 0 16px}
#login input{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:6px;background:#fff;font-size:15px;margin-bottom:12px}
#login .btn{width:100%;padding:9px}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:rgba(90,57,33,.94);color:#fff8ee;padding:9px 18px;border-radius:999px;
  font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:80vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:rgba(168,50,45,.95)}
.empty{color:var(--muted);font-size:13.5px;padding:18px}
@media(max-width:820px){
  main{flex-direction:column;height:auto;overflow:visible}
  aside{width:auto;flex:none;max-height:38vh;border-right:none;border-bottom:1px solid var(--line)}
  section.editor{padding:14px}
  textarea#body{min-height:34vh}
}
</style>
</head>
<body>

<header>
  <h1>道玄文集 · 后台</h1>
  <span class="badge" id="stat">检查登录状态…</span>
  <span class="sp"></span>
  <a class="btn" href="index1.html" target="_blank" style="text-decoration:none">查看前台</a>
  <button class="btn" id="btnNew">新建文章</button>
  <button class="btn" id="btnLogout" style="display:none">退出登录</button>
</header>

<main>
  <aside>
    <div class="search"><input id="q" type="search" placeholder="按标题 / 分类筛选…"></div>
    <ul id="list"></ul>
  </aside>

  <section class="editor">
    <div id="form" style="display:none">
      <div class="row">
        <div class="field" style="flex:2">
          <label>标题</label>
          <input id="title" type="text" placeholder="文章标题">
        </div>
        <div class="field">
          <label>分类</label>
          <input id="category" type="text" list="cats" placeholder="散文">
          <datalist id="cats">
            <option value="散文"><option value="诗"><option value="词"><option value="其它">
          </datalist>
        </div>
      </div>
      <div class="row">
        <div class="field" style="flex:2">
          <label>日期（沿用原有写法，如「乙巳年五月初一」）</label>
          <input id="date" type="text" placeholder="乙巳年五月初一">
        </div>
        <div class="field">
          <label>状态</label>
          <select id="status">
            <option value="published">发布</option>
            <option value="draft">草稿（前台不显示）</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>正文（纯文本 Markdown，段落用空行分隔；`##`/`###` 小标题，`**粗体**`，`> 注释`）</label>
        <textarea id="body" spellcheck="false"></textarea>
      </div>

      <div class="toolbar">
        <button class="btn primary" id="btnSave">保存</button>
        <button class="btn" id="btnPreview">预览 / 收起</button>
        <button class="btn danger" id="btnDelete">删除本文</button>
        <span class="sp" style="flex:1"></span>
        <span class="hint" id="meta"></span>
      </div>

      <div class="preview" id="preview" style="display:none"></div>
    </div>

    <div class="empty" id="welcome">
      左侧选择一篇文章进行编辑，或点右上角「新建文章」。<br><br>
      保存后立即写入数据库，前台刷新即可看到改动，无需再跑批处理、也无需推送 GitHub。
    </div>
  </section>
</main>

<div id="login">
  <div class="box">
    <h2>道玄文集 · 后台</h2>
    <p>请输入管理密码</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="管理密码">
    <button class="btn primary" id="btnLogin">登录</button>
    <p id="loginErr" style="color:#a8322d;margin:12px 0 0;min-height:18px"></p>
  </div>
</div>

<div id="toast"></div>

<script src="render.js"></script>
<script>
(function () {
  'use strict';

  var currentAid = null;
  var cache = [];

  function $(id) { return document.getElementById(id); }

  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = isErr ? 'show err' : 'show';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, 2600);
  }

  function api(path, opts) {
    opts = opts || {};
    var init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.headers['X-DX-Admin'] = '1';
      init.body = JSON.stringify(opts.body);
    }
    return fetch(path, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok || j.ok === false) {
          var err = new Error(j.error || ('HTTP ' + r.status));
          err.status = r.status;
          throw err;
        }
        return j;
      });
    });
  }

  /* ---------------- 登录态 ---------------- */

  function checkSession() {
    return fetch('/api/session', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.admin) { onLoggedIn(); return true; }
        return false;
      })
      .catch(function () { return false; });
  }

  function onLoggedIn() {
    $('login').style.display = 'none';
    $('btnLogout').style.display = 'inline-block';
    $('stat').textContent = '已登录';
    loadList();
  }

  $('btnLogin').onclick = function () {
    var pw = $('pw').value;
    if (!pw) return;
    $('loginErr').textContent = '';
    api('/api/login', { method: 'POST', body: { password: pw } })
      .then(function () { $('pw').value = ''; onLoggedIn(); toast('登录成功'); })
      .catch(function (e) { $('loginErr').textContent = e.message; });
  };
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnLogin').click(); });

  $('btnLogout').onclick = function () {
    api('/api/session', { method: 'POST' }).then(function () { location.reload(); });
  };

  /* ---------------- 列表 ---------------- */

  function loadList() {
    return api('/api/articles?all=1')
      .then(function (j) {
        cache = j.articles || [];
        $('stat').textContent = '已登录 · 共 ' + cache.length + ' 篇';
        renderList();
      })
      .catch(function (e) { toast('读取列表失败：' + e.message, true); });
  }

  function renderList() {
    var kw = ($('q').value || '').trim().toLowerCase();
    var ul = $('list');
    ul.innerHTML = '';
    var n = 0;
    cache.forEach(function (a) {
      if (kw && String(a.title).toLowerCase().indexOf(kw) < 0 &&
          String(a.category).toLowerCase().indexOf(kw) < 0) return;
      n++;
      var li = document.createElement('li');
      if (currentAid && a.aid === currentAid) li.className = 'active';
      li.innerHTML = '<span class="no">' + a.id + '.</span>' + escapeHtml(a.title) +
        ' <small>(' + escapeHtml(a.category) + ')</small>' +
        (a.status === 'draft' ? '<span class="draft">草稿</span>' : '');
      li.onclick = function () { openArticle(a.aid); };
      ul.appendChild(li);
    });
    if (!n) ul.innerHTML = '<div class="empty">没有匹配的文章</div>';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  $('q').addEventListener('input', renderList);

  /* ---------------- 编辑 ---------------- */

  function openArticle(aid) {
    api('/api/articles/' + aid)
      .then(function (j) {
        var a = j.article;
        currentAid = a.aid;
        $('form').style.display = 'block';
        $('welcome').style.display = 'none';
        $('title').value = a.title || '';
        $('category').value = a.category || '';
        $('date').value = a.date || '';
        $('status').value = a.status || 'published';
        $('body').value = a.body || '';
        $('meta').textContent = '数据库主键 ' + a.aid + ' · 更新于 ' + (a.updated_at || '—');
        $('preview').style.display = 'none';
        renderList();
      })
      .catch(function (e) { toast('打开失败：' + e.message, true); });
  }

  $('btnNew').onclick = function () {
    currentAid = null;
    $('form').style.display = 'block';
    $('welcome').style.display = 'none';
    $('title').value = '';
    $('category').value = '散文';
    $('date').value = '';
    $('status').value = 'published';
    $('body').value = '';
    $('meta').textContent = '新建中（尚未保存）';
    $('preview').style.display = 'none';
    $('title').focus();
    renderList();
  };

  function payload() {
    return {
      title: $('title').value,
      category: $('category').value,
      date: $('date').value,
      status: $('status').value,
      body: $('body').value
    };
  }

  function save() {
    var p = payload();
    if (!String(p.title).trim()) { toast('标题不能为空', true); $('title').focus(); return; }
    var btn = $('btnSave');
    btn.disabled = true;
    var req = currentAid
      ? api('/api/articles/' + currentAid, { method: 'PUT', body: p })
      : api('/api/articles', { method: 'POST', body: p });

    req.then(function (j) {
      btn.disabled = false;
      if (!currentAid && j.article) { currentAid = j.article.aid; }
      toast('已保存');
      return loadList().then(function () {
        if (currentAid) openArticle(currentAid);
      });
    }).catch(function (e) {
      btn.disabled = false;
      if (e.status === 401) { toast('会话已过期，请重新登录', true); $('login').style.display = 'flex'; }
      else toast('保存失败：' + e.message, true);
    });
  }

  $('btnSave').onclick = save;

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if ($('form').style.display !== 'none') save();
    }
  });

  $('btnDelete').onclick = function () {
    if (!currentAid) { toast('当前是未保存的新文章', true); return; }
    var t = $('title').value || '这篇文章';
    if (!confirm('确定删除《' + t + '》？此操作不可撤销。')) return;
    api('/api/articles/' + currentAid, { method: 'DELETE' })
      .then(function () {
        toast('已删除');
        currentAid = null;
        $('form').style.display = 'none';
        $('welcome').style.display = 'block';
        loadList();
      })
      .catch(function (e) { toast('删除失败：' + e.message, true); });
  };

  /* ---------------- 预览 ---------------- */

  $('btnPreview').onclick = function () {
    var pv = $('preview');
    if (pv.style.display !== 'none') { pv.style.display = 'none'; return; }
    var html;
    try {
      html = window.DXRender
        ? window.DXRender.renderBody($('body').value, $('category').value)
        : '<pre>' + escapeHtml($('body').value) + '</pre>';
    } catch (e) {
      html = '<pre>' + escapeHtml($('body').value) + '</pre>';
    }
    pv.innerHTML = html;
    pv.style.display = 'block';
  };

  /* ---------------- 启动 ---------------- */
  checkSession();
})();
</script>
</body>
</html>
