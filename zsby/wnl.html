<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>万年历 · 增删卜易</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #e8f1f2;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(205, 224, 228, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 228, 232, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(195, 216, 220, 0.45) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '☯';
            position: fixed;
            font-size: 250px;
            color: rgba(255, 248, 240, 0.03);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: taijiSpin 50s linear infinite;
        }
        @keyframes taijiSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.1); }
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 780px;
            width: 100%;
            background: rgba(246, 239, 230, 0.92);
            backdrop-filter: blur(12px);
            padding: 26px 26px 36px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px #6b5a48 inset, 0 0 0 2px #bcab97 inset;
            border: 1px solid #c9b9a5;
            align-self: flex-start;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            font-weight: normal;
            letter-spacing: 8px;
            color: #3f2e1e;
            text-shadow: 1px 1px 0 #d6c8b8;
            border-bottom: 2px solid #cbb8a4;
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .nav-bar a {
            color: #6b4f39;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 30px;
            background: #ede3d7;
            border: 1px solid #d5c6b4;
            font-size: 13px;
            transition: 0.2s;
        }
        .nav-bar a:hover { background: #d5c6b4; }
        .nav-bar a.active { background: #6b4f39; color: #f5ede4; border-color: #6b4f39; }
        .nav-bar a.external-link { background: #ede3d7; color: #6b4f39; }

        /* ===== 节气信息条 ===== */
        .jieqi-bar {
            background: linear-gradient(90deg, #f6efe6, #fcf8f0, #f6efe6);
            border: 1px solid #e0d3c4;
            border-radius: 14px;
            padding: 10px 16px;
            text-align: center;
            font-size: 14px;
            color: #5a4632;
            margin-bottom: 16px;
            letter-spacing: 1px;
            min-height: 40px;
            display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: 4px;
        }
        .jieqi-bar .jq-name { color: #b33a2a; font-weight: bold; }
        .jieqi-bar .jq-sub { color: #8a765d; font-size: 12px; }

        /* ===== 日期输入框 ===== */
        .date-input-wrapper {
            background: #fcf8f0;
            border: 1px solid #d5c6b4;
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }
        .date-input-wrapper .rtitle {
            font-size: 12px; color: #7a6652; letter-spacing: 2px; margin-bottom: 8px;
        }
        .date-input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .date-input {
            text-align: center;
            font-size: 24px;
            font-family: 'Georgia', serif;
            border: 1px solid #cbb8a4;
            border-radius: 10px;
            background: #fff;
            color: #3f2e1e;
            padding: 10px 6px;
            -webkit-appearance: none;
            appearance: none;
        }
        .date-input:focus {
            outline: none;
            border-color: #6b4f39;
            box-shadow: 0 0 0 2px rgba(107,79,57,0.15);
        }
        .date-input.year { width: 104px; letter-spacing: 2px; }
        .date-input.md { width: 64px; }
        .date-sep {
            font-size: 26px;
            color: #8a765d;
            font-weight: bold;
            user-select: none;
        }
        .date-note {
            margin-top: 8px;
            font-size: 12px;
            color: #a48d78;
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        /* ===== 时间 / 地点 ===== */
        .row-card {
            background: rgba(255,248,240,0.6);
            border: 1px solid #d5c6b4;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 14px;
        }
        .row-card .rtitle {
            font-size: 12px; color: #7a6652; letter-spacing: 2px; margin-bottom: 8px;
        }
        .time-row, .loc-row {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        select {
            padding: 9px 10px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #cbb8a4;
            background: #fcf8f0;
            font-family: inherit;
            color: #3c2e22;
            -webkit-appearance: none; appearance: none; padding-right: 8px;
        }
        .time-row select { width: 64px; text-align-last: center; }
        .loc-status {
            font-size: 14px;
            color: #5a4632;
            flex: 1;
            min-width: 0;
            line-height: 1.4;
        }
        .loc-status.success { color: #2d7a3d; font-weight: bold; }
        .loc-status.loading::after {
            content: '';
            display: inline-block;
            width: 10px; height: 10px;
            border: 2px solid #6b4f39;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-left: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            background: #b09a84; border: 1px solid #c9b49e; color: #2d241c;
            padding: 9px 16px; border-radius: 30px; font-size: 14px; cursor: pointer;
            font-family: inherit; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            white-space: nowrap;
        }
        .btn:hover { background: #c0aa94; }
        .btn-primary { background: #6b4f39; color: #f5ede4; border-color: #8f745b; box-shadow: 0 3px 0 #3d2d1f; }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 0 0 #3d2d1f; }

        /* ===== 结果区 ===== */
        .result-area {
            background: #fcf8f0; border: 1px solid #d5c6b4; border-radius: 18px;
            padding: 16px; min-height: 120px;
        }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .result-card {
            background: #f6efe6; border: 1px solid #e0d3c4; border-radius: 12px; padding: 10px 14px;
        }
        .result-card .label { font-size: 11px; color: #7a6652; letter-spacing: 2px; margin-bottom: 3px; }
        .result-card .value { font-size: 18px; font-weight: bold; color: #3f2e1e; }
        .result-card .value.small { font-size: 15px; }
        .result-card .value .hl { color: #6b4f39; }
        .result-card .value .yuejian { color: #b33; font-weight: bold; }
        .result-card .value .richen { color: #3366aa; font-weight: bold; }
        .result-card .value .xunkong { color: #999; }
        .result-card .value .yuepo { color: #b33; font-weight: bold; }
        .result-card .value .richong { color: #e67e22; font-weight: bold; }
        .result-card.full { grid-column: 1 / -1; }
        /* 断卦参数行布局 */
        .info-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
        .info-label { font-size: 13px; color: #7a6652; white-space: nowrap; min-width: 72px; }
        .info-value { font-size: 16px; font-weight: bold; color: #3f2e1e; }
        .pillar-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
        .pillar-label { font-size: 13px; color: #7a6652; white-space: nowrap; min-width: 58px; }
        .pillar-gz { font-size: 18px; font-weight: bold; color: #3f2e1e; }
        .na-yin { font-size: 13px; color: #7a6652; margin-left: 4px; }
        .card-divider { border-top: 1px dashed #e0d3c4; margin: 6px 0; }
        .liu-section { margin-top: 6px; }
        .liu-title { font-size: 13px; color: #7a6652; margin-bottom: 3px; }
        .liu-shen-list { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; font-weight: bold; color: #3f2e1e; line-height: 1.7; }
        .liu-qin-list { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: #3f2e1e; line-height: 1.7; }
        .liu-qin-list .lq-label { color: #7a6652; font-size: 12px; }
        /* 地点区域单行 */
        .loc-card {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .loc-card .loc-title { font-size: 14px; font-weight: bold; color: #3f2e1e; white-space: nowrap; }
        .loc-card .loc-hint { font-size: 12px; color: #7a6652; white-space: nowrap; }
        .json-box {
            margin-top: 12px; background: #2d241c; color: #d6c8b8; border-radius: 10px;
            padding: 10px 12px; font-size: 12px; font-family: 'Consolas', monospace;
            white-space: pre-wrap; word-break: break-all; line-height: 1.5;
        }
        .footer-note { margin-top: 16px; font-size: 12px; color: #a48d78; text-align: center;
            border-top: 1px solid #e0d3c4; padding-top: 12px; letter-spacing: 1px; }

        @media (max-width: 500px) {
            body { padding: 4px; }
            .container { padding: 12px 10px 18px; border-radius: 24px 24px 16px 16px; }
            h1 { font-size: 19px; letter-spacing: 4px; }
            .nav-bar { gap: 5px; }
            .nav-bar a { flex: 1 1 calc(25% - 6px); text-align: center; min-width: 0; font-size: 11px; padding: 5px 3px; }
            .date-input { font-size: 22px; padding: 12px 6px; }
            .date-input.year { width: 92px; }
            .date-input.md { width: 58px; }
            .date-sep { font-size: 22px; }
            .result-grid { grid-template-columns: 1fr; }
            .time-row select { width: 56px; }
            .loc-card { gap: 6px; }
            .loc-card .loc-title { font-size: 13px; }
            .loc-card .loc-hint { font-size: 11px; }
            .info-row { padding: 2px 0; }
            .pillar-row { padding: 2px 0; }
            .info-value { font-size: 14px; }
            .pillar-gz { font-size: 16px; }
            .liu-shen-list { font-size: 14px; gap: 4px 10px; }
            .liu-qin-list { font-size: 13px; gap: 4px 10px; }
        }
    </style>
</head>

<div class="container">
    <h1>📜 万年历 · 排盘</h1>

    <div class="nav-bar">
        <a href="liuyao_divine.html">🔮 起卦</a>
        <a href="jiegu.html">📜 释卦</a>
        <a href="history.html">📖 历史</a>

        <a href="../index1.html" target="_blank" class="external-link">🏠 文集</a>
    </div>

    <div class="jieqi-bar" id="jieqiBar">—</div>

    <div class="date-input-wrapper">
        <div class="rtitle">📅 公历日期</div>
        <div class="date-input-row">
            <input type="text" id="inpYear" class="date-input year" maxlength="4" inputmode="numeric" placeholder="年">
            <span class="date-sep">/</span>
            <input type="text" id="inpMonth" class="date-input md" maxlength="2" inputmode="numeric" placeholder="月">
            <span class="date-sep">/</span>
            <input type="text" id="inpDay" class="date-input md" maxlength="2" inputmode="numeric" placeholder="日">
        </div>
        <div class="date-note">注：生肖以立春为界（多在公历 2 月 4 日前后，非正月初一）</div>
    </div>

    <div class="row-card">
        <div class="rtitle">⏰ 时辰（北京时间）</div>
        <div class="time-row">
            <select id="selHour"></select> 时
            <select id="selMin"></select> 分
        </div>
    </div>

    <div class="row-card loc-card">
        <span class="loc-title">📍 占卜地点</span>
        <span class="loc-hint">用于真太阳时校正</span>
        <button class="btn btn-primary" id="btnLoc">🎯 自动定位</button>
        <span class="loc-status" id="locMsg"></span>
    </div>

    <div class="result-area" id="resultArea">—</div>

    <div class="footer-note">📜 月建遵节气 · 时辰用真太阳时 · 子时（23-24）日柱归本日 · 仅供研究参考</div>
</div>

<script src="../lunar.js"></script>
<script>
(function(){
    'use strict';
    // ============ 常量 ============
    var YEAR_MIN = 1900, YEAR_MAX = 2100;
    var GAN  = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    var ZHI  = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    // 生肖：由年柱地支映射（保证与年柱一致，避免立春前后偏差）
    var ZHI_ANIMAL = {'子':'鼠','丑':'牛','寅':'虎','卯':'兔','辰':'龙','巳':'蛇',
                      '午':'马','未':'羊','申':'猴','酉':'鸡','戌':'狗','亥':'猪'};
    var Solar = window.Solar;

    // ============ DOM ============
    var inpYear  = document.getElementById('inpYear');
    var inpMonth = document.getElementById('inpMonth');
    var inpDay   = document.getElementById('inpDay');
    var selHour  = document.getElementById('selHour');
    var selMin   = document.getElementById('selMin');
    var btnLoc   = document.getElementById('btnLoc');
    var jieqiBar = document.getElementById('jieqiBar');
    var resultArea = document.getElementById('resultArea');
    var locMsg   = document.getElementById('locMsg');

    // ============ 状态 ============
    var state = { y: 0, m: 0, d: 0, h: 0, mi: 0, lng: 116.41, placeName: '北京基准', locationType: 'fallback' };

    // ============ 工具：真太阳时 ============
    function equationOfTime(dayOfYear){
        var B = 2 * Math.PI * (dayOfYear - 81) / 365;
        return 9.87 * Math.sin(2*B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    }
    function trueSolarTime(y, m, d, h, mi, lng){
        var bjMin = h*60 + mi;
        var lonCorr = (lng - 120) * 4;
        var dim = [31,28,31,30,31,30,31,31,30,31,30,31];
        var isLeap = (y%4===0 && y%100!==0) || (y%400===0);
        if(isLeap) dim[1]=29;
        var doy = 0;
        for(var i=0;i<m-1;i++) doy += dim[i];
        doy += d;
        var eot = equationOfTime(doy);
        var ztMin = bjMin + lonCorr + eot;
        ztMin = ((ztMin % 1440) + 1440) % 1440;
        var ztH = Math.floor(ztMin/60);
        var ztMi = Math.floor(ztMin%60);
        var ztS = Math.round((ztMin - Math.floor(ztMin))*60);
        if(ztS>=60){ ztS-=60; ztMi+=1; }
        if(ztMi>=60){ ztMi-=60; ztH+=1; }
        ztH = ztH % 24;
        var p2 = function(n){ return n<10?'0'+n:''+n; };
        return { h: ztH, mi: ztMi, s: ztS, text: p2(ztH)+':'+p2(ztMi)+':'+p2(ztS) };
    }

    // ============ 工具：农历 ============
    function lunarOf(y,m,d){
        return Solar.fromYmd(y,m,d).getLunar();
    }

    // ============ 日期输入框逻辑 ============
    function daysInMonth(y, m){
        var dim = [31,28,31,30,31,30,31,31,30,31,30,31];
        var isLeap = (y%4===0 && y%100!==0) || (y%400===0);
        if(isLeap && m===2) return 29;
        return dim[m-1];
    }
    // 仅保留数字并截断
    function onlyDigits(v, max){
        return v.replace(/\D/g, '').slice(0, max);
    }
    // 失焦时补零 + 范围修正
    function padField(input, maxLen){
        var v = input.value.replace(/\D/g, '');
        if(v.length === 0) return;
        var n = parseInt(v, 10);
        if(isNaN(n)) return;
        if(input === inpYear){
            if(n < YEAR_MIN) n = YEAR_MIN;
            if(n > YEAR_MAX) n = YEAR_MAX;
        }else if(input === inpMonth){
            if(n < 1) n = 1;
            if(n > 12) n = 12;
        }else if(input === inpDay){
            var y = parseInt(inpYear.value, 10);
            var m = parseInt(inpMonth.value, 10);
            if(!isNaN(y) && !isNaN(m)){
                var maxD = daysInMonth(y, m);
                if(n < 1) n = 1;
                if(n > maxD) n = maxD;
            }else{
                if(n < 1) n = 1;
                if(n > 31) n = 31;
            }
        }
        var s = String(n);
        while(s.length < maxLen) s = '0' + s;
        input.value = s;
    }
    // 尝试解析三框并 render（不合法则不更新）
    function tryUpdateFromInput(){
        var y = parseInt(inpYear.value, 10);
        var m = parseInt(inpMonth.value, 10);
        var d = parseInt(inpDay.value, 10);
        if(isNaN(y) || y < YEAR_MIN || y > YEAR_MAX) return;
        if(isNaN(m) || m < 1 || m > 12) return;
        if(isNaN(d) || d < 1 || d > daysInMonth(y, m)) return;
        state.y = y; state.m = m; state.d = d;
        render();
    }

    // —— 年框：只允许数字，满4位自动跳月 ——
    inpYear.addEventListener('input', function(){
        this.value = onlyDigits(this.value, 4);
        if(this.value.length === 4) inpMonth.focus();
        tryUpdateFromInput();
    });
    // —— 月框：只允许数字，超12截断，满2位自动跳日 ——
    inpMonth.addEventListener('input', function(){
        this.value = onlyDigits(this.value, 2);
        var m = parseInt(this.value, 10);
        if(!isNaN(m) && m > 12) this.value = '12';
        if(this.value.length === 2) inpDay.focus();
        // 月份变化后，若当前日超出新月份上限则自动修正
        var y = parseInt(inpYear.value, 10);
        if(!isNaN(y) && this.value.length > 0){
            var m2 = parseInt(this.value, 10);
            if(!isNaN(m2)){
                var d = parseInt(inpDay.value, 10);
                if(!isNaN(d) && d > daysInMonth(y, m2)){
                    inpDay.value = String(daysInMonth(y, m2));
                }
            }
        }
        tryUpdateFromInput();
    });
    // —— 日框：只允许数字，超当月上限截断 ——
    inpDay.addEventListener('input', function(){
        this.value = onlyDigits(this.value, 2);
        var y = parseInt(inpYear.value, 10);
        var m = parseInt(inpMonth.value, 10);
        if(!isNaN(y) && !isNaN(m)){
            var d = parseInt(this.value, 10);
            if(!isNaN(d) && d > daysInMonth(y, m)){
                this.value = String(daysInMonth(y, m));
            }
        }
        tryUpdateFromInput();
    });
    // 失焦补零
    inpYear.addEventListener('blur',  function(){ padField(this, 4); tryUpdateFromInput(); });
    inpMonth.addEventListener('blur', function(){ padField(this, 2); tryUpdateFromInput(); });
    inpDay.addEventListener('blur',   function(){ padField(this, 2); tryUpdateFromInput(); });

    // ============ 排盘输出 ============
    function p2(n){ return n<10?'0'+n:''+n; }
    function arrDiffDaysHours(fromDate, toDate){
        var ms = toDate - fromDate;
        if(ms<0) ms=0;
        var totalMin = Math.floor(ms/60000);
        var days = Math.floor(totalMin/1440);
        var hours = Math.floor((totalMin%1440)/60);
        var mins = totalMin%60;
        return { days: days, hours: hours, mins: mins };
    }
    function zodiacOfYearGanZhi(ygz){
        var zhi = ygz.charAt(1);
        return ZHI_ANIMAL[zhi] || '—';
    }
    // 时辰干支（五鼠遁），基于日柱日干
    function hourGanZhi(dayGanZhi, ztH){
        var dayGan = dayGanZhi.charAt(0);
        var dgIdx = GAN.indexOf(dayGan);
        var ziGanIdx = (dgIdx % 5) * 2; // 甲己→0(甲),乙庚→2(丙),丙辛→4(戊),丁壬→6(庚),戊癸→8(壬)
        var zhiIdx = Math.floor(((ztH+1)%24)/2); // 23→0,0→0,1→1,3→2...
        var ganIdx = (ziGanIdx + zhiIdx) % 10;
        return GAN[ganIdx] + ZHI[zhiIdx];
    }

    // ============ 断卦参数函数（7项） ============
    // 1. 旬空：依日柱干支推算（算法版，按旬首地支推算，已验证正确）
    function getXunKong(dayGanZhi) {
        var ganIdx = GAN.indexOf(dayGanZhi.charAt(0));
        var zhiIdx = ZHI.indexOf(dayGanZhi.charAt(1));
        var xunShouZhiIdx = zhiIdx - (ganIdx % 10);
        xunShouZhiIdx = ((xunShouZhiIdx % 12) + 12) % 12;
        var k1 = (xunShouZhiIdx + 10) % 12;
        var k2 = (xunShouZhiIdx + 11) % 12;
        return ZHI[k1] + ZHI[k2];
    }
    // 2. 月破：月建（月柱地支）所冲之地支
    var CHONG_MAP = {'寅':'申','卯':'酉','辰':'戌','巳':'亥','午':'子','未':'丑',
                     '申':'寅','酉':'卯','戌':'辰','亥':'巳','子':'午','丑':'未'};
    function getYuePo(yueZhi) { return CHONG_MAP[yueZhi] || '—'; }
    // 3. 日冲：日辰（日柱地支）所冲之地支
    function getRiChong(riZhi) { return CHONG_MAP[riZhi] || '—'; }
    // 4. 驿马：依年支（或日支）推算
    function getYiMa(nianZhi) {
        var map = {'申':'寅','子':'寅','辰':'寅','寅':'申','午':'申','戌':'申',
                   '巳':'亥','酉':'亥','丑':'亥','亥':'巳','卯':'巳','未':'巳'};
        return map[nianZhi] || '—';
    }
    // 5. 六神：依日干起神，返回长度6数组（初爻→上爻）
    function getLiuShen(dayGan) {
        var liushen = ['青龙','朱雀','勾陈','螣蛇','白虎','玄武'];
        var dayGanMap = {'甲':0,'乙':0,'丙':1,'丁':1,'戊':2,'己':3,'庚':4,'辛':4,'壬':5,'癸':5};
        var start = dayGanMap[dayGan];
        if(start === undefined) return ['—','—','—','—','—','—'];
        var result = [];
        for(var i=0; i<6; i++) result.push(liushen[(start+i)%6]);
        return result;
    }
    // 6. 六亲：以日干为"我"，返回日干与 otherGan 的六亲关系
    function getLiuQin(dayGan, otherGan) {
        var wuxing = {'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
        var me = wuxing[dayGan], other = wuxing[otherGan];
        if(!me || !other) return '—';
        var relation = {
            '木': {'木':'兄弟','火':'子孙','土':'妻财','金':'官鬼','水':'父母'},
            '火': {'火':'兄弟','土':'子孙','金':'妻财','水':'官鬼','木':'父母'},
            '土': {'土':'兄弟','金':'子孙','水':'妻财','木':'官鬼','火':'父母'},
            '金': {'金':'兄弟','水':'子孙','木':'妻财','火':'官鬼','土':'父母'},
            '水': {'水':'兄弟','木':'子孙','火':'妻财','土':'官鬼','金':'父母'}
        };
        return relation[me][other] || '—';
    }
    // 7. 纳音：六十甲子纳音表
    function getNaYin(ganZhi) {
        var map = {
            '甲子':'海中金','乙丑':'海中金','丙寅':'炉中火','丁卯':'炉中火',
            '戊辰':'大林木','己巳':'大林木','庚午':'路旁土','辛未':'路旁土',
            '壬申':'剑锋金','癸酉':'剑锋金','甲戌':'山头火','乙亥':'山头火',
            '丙子':'涧下水','丁丑':'涧下水','戊寅':'城头土','己卯':'城头土',
            '庚辰':'白蜡金','辛巳':'白蜡金','壬午':'杨柳木','癸未':'杨柳木',
            '甲申':'泉中水','乙酉':'泉中水','丙戌':'屋上土','丁亥':'屋上土',
            '戊子':'霹雳火','己丑':'霹雳火','庚寅':'松柏木','辛卯':'松柏木',
            '壬辰':'长流水','癸巳':'长流水','甲午':'沙中金','乙未':'沙中金',
            '丙申':'山下火','丁酉':'山下火','戊戌':'平地木','己亥':'平地木',
            '庚子':'壁上土','辛丑':'壁上土','壬寅':'金箔金','癸卯':'金箔金',
            '甲辰':'覆灯火','乙巳':'覆灯火','丙午':'天河水','丁未':'天河水',
            '戊申':'大驿土','己酉':'大驿土','庚戌':'钗钏金','辛亥':'钗钏金',
            '壬子':'桑柘木','癸丑':'桑柘木','甲寅':'大溪水','乙卯':'大溪水',
            '丙辰':'沙中土','丁巳':'沙中土','戊午':'天上火','己未':'天上火',
            '庚申':'石榴木','辛酉':'石榴木','壬戌':'大海水','癸亥':'大海水'
        };
        return map[ganZhi] || '—';
    }

    function render(){
        var y=state.y, m=state.m, d=state.d, h=state.h, mi=state.mi, lng=state.lng;
        // 真太阳时
        var zt = trueSolarTime(y,m,d,h,mi,lng);

        // 日柱：铁律三——始终取当天（fromYmd，不带时间，子时23-24归当天）
        var dayLunar = lunarOf(y,m,d);
        var dayGZ = dayLunar.getDayInGanZhi();

        // 年柱（立春精确）、月柱（节气精确）：用真太阳时构造
        var timeSolar = Solar.fromYmdHms(y,m,d, zt.h, zt.mi, zt.s);
        var timeLunar = timeSolar.getLunar();
        var yearGZ = timeLunar.getYearInGanZhiExact();
        var monthGZ = timeLunar.getMonthInGanZhiExact();

        // 时柱（五鼠遁，基于日柱日干）
        var hourGZ = hourGanZhi(dayGZ, zt.h);

        // 生肖（由年柱地支映射）
        var zodiac = zodiacOfYearGanZhi(yearGZ);

        // 农历
        var lunarStr = dayLunar.getMonthInChinese()+'月'+dayLunar.getDayInChinese();

        // 星期
        var weekDay = ['日','一','二','三','四','五','六'][new Date(y, m-1, d).getDay()];

        // 时辰名
        var zhiIdx = Math.floor(((zt.h+1)%24)/2);
        var shichenName = ZHI[zhiIdx] + '时';

        // ===== 断卦参数 =====
        var xunKong = getXunKong(dayGZ);
        var yueZhi = monthGZ.charAt(1);
        var riZhi = dayGZ.charAt(1);
        var nianZhi = yearGZ.charAt(1);
        var yuePo = getYuePo(yueZhi);
        var riChong = getRiChong(riZhi);
        var yiMa = getYiMa(nianZhi);
        var liuShen = getLiuShen(dayGZ.charAt(0)); // 数组6元

        // 六亲：各柱天干与日干的关系
        var dayGan = dayGZ.charAt(0);
        var lqNian = getLiuQin(dayGan, yearGZ.charAt(0));
        var lqYue  = getLiuQin(dayGan, monthGZ.charAt(0));
        var lqRi   = '兄弟';
        var lqShi  = getLiuQin(dayGan, hourGZ.charAt(0));

        // 纳音
        var nyNian = getNaYin(yearGZ);
        var nyYue  = getNaYin(monthGZ);
        var nyRi   = getNaYin(dayGZ);
        var nyShi  = getNaYin(hourGZ);

        // 节气信息
        var curJq = timeLunar.getPrevJieQi(false);
        var nextJq = timeLunar.getNextJieQi(false);
        var jqText = '当前节气：';
        if(curJq){
            jqText += '<span class="jq-name">'+curJq.getName()+'</span>';
        }else{
            jqText += '—';
        }
        if(nextJq){
            var ns = nextJq.getSolar();
            var nextDate = new Date(ns.getYear(), ns.getMonth()-1, ns.getDay(), ns.getHour(), ns.getMinute(), ns.getSecond());
            var curDate = new Date(y, m-1, d, h, mi, 0);
            var diff = arrDiffDaysHours(curDate, nextDate);
            jqText += '<span class="jq-sub">　距下个节气 '+nextJq.getName()+' 还有 '+diff.days+'天'+diff.hours+'小时'+diff.mins+'分</span>';
        }
        jieqiBar.innerHTML = jqText;

        // JSON 输出
        var result = {
            solar_date: y+'-'+p2(m)+'-'+p2(d)+' '+p2(h)+':'+p2(mi)+':00',
            lunar_date: lunarStr,
            week: '星期'+weekDay,
            shichen: shichenName,
            ganzhi: { year: yearGZ, month: monthGZ, day: dayGZ, hour: hourGZ },
            nayin: { year: nyNian, month: nyYue, day: nyRi, hour: nyShi },
            zodiac: zodiac,
            xunkong: xunKong,
            yuepo: yuePo,
            richong: riChong,
            yima: yiMa,
            liushen: liuShen,
            liuqin: { year: lqNian, month: lqYue, day: lqRi, hour: lqShi },
            jieqi: curJq ? curJq.getName() : '—',
            zhen_sun_time: zt.text,
            place: state.placeName,
            longitude: lng
        };

        // ===== 左栏：公历 / 农历 / 真太阳时 / 时辰 + 四柱含纳音 =====
        var leftHtml =
            '<div class="info-row"><span class="info-label">📅 公历</span><span class="info-value">'+y+'年'+m+'月'+d+'日 星期'+weekDay+'</span></div>'+
            '<div class="info-row"><span class="info-label">🌙 农历</span><span class="info-value">'+lunarStr+'</span></div>'+
            '<div class="info-row"><span class="info-label">⏰ 真太阳时</span><span class="info-value">'+zt.text+'</span></div>'+
            '<div class="info-row"><span class="info-label">🕐 时辰</span><span class="info-value">'+shichenName+'</span></div>'+
            '<div class="card-divider"></div>'+
            '<div class="pillar-row"><span class="pillar-label">🌳 年柱</span><span class="pillar-gz">'+yearGZ+'</span><span class="na-yin">'+nyNian+'</span></div>'+
            '<div class="pillar-row"><span class="pillar-label">🌿 月柱</span><span class="pillar-gz"><span class="yuejian">'+monthGZ+'</span></span><span class="na-yin">'+nyYue+'</span></div>'+
            '<div class="pillar-row"><span class="pillar-label">☀️ 日柱</span><span class="pillar-gz"><span class="richen">'+dayGZ+'</span></span><span class="na-yin">'+nyRi+'</span></div>'+
            '<div class="pillar-row"><span class="pillar-label">⏰ 时柱</span><span class="pillar-gz">'+hourGZ+'</span><span class="na-yin">'+nyShi+'</span></div>';

        // ===== 右栏：旬空 / 月破 / 日冲 / 驿马 + 六神 + 六亲 =====
        var rightHtml =
            '<div class="info-row"><span class="info-label">🔮 旬空</span><span class="info-value xunkong">'+xunKong+'</span></div>'+
            '<div class="info-row"><span class="info-label">💥 月破</span><span class="info-value yuepo">'+yuePo+'</span></div>'+
            '<div class="info-row"><span class="info-label">⚡ 日冲</span><span class="info-value richong">'+riChong+'</span></div>'+
            '<div class="info-row"><span class="info-label">🐎 驿马</span><span class="info-value">'+yiMa+'</span></div>'+
            '<div class="card-divider"></div>'+
            '<div class="liu-section">'+
                '<div class="liu-title">六神（初爻→上爻）</div>'+
                '<div class="liu-shen-list">'+liuShen.join('　')+'</div>'+
            '</div>'+
            '<div class="liu-section">'+
                '<div class="liu-title">六亲（以日干为我）</div>'+
                '<div class="liu-qin-list">'+
                    '<span><span class="lq-label">年</span> '+lqNian+'</span>　'+
                    '<span><span class="lq-label">月</span> '+lqYue+'</span>　'+
                    '<span><span class="lq-label">日</span> '+lqRi+'</span>　'+
                    '<span><span class="lq-label">时</span> '+lqShi+'</span>'+
                '</div>'+
            '</div>';

        // 生肖标签（放在左栏顶部或独立显示）
        var zodiacHtml = '<div class="info-row"><span class="info-label">🐾 生肖</span><span class="info-value">'+zodiac+'（'+yearGZ+'年）</span></div>';

        var html = '<div class="result-grid">'+
            '<div class="result-card">'+leftHtml+'</div>'+
            '<div class="result-card">'+rightHtml+'</div>'+
            '<div class="result-card full">'+zodiacHtml+'</div>'+
            '<div class="result-card full"><div class="label">📡 数据输出（JSON）</div><div class="json-box">'+escapeHtml(JSON.stringify(result,null,2))+'</div></div>'+
            '</div>';
        resultArea.innerHTML = html;

        // 存 localStorage 供起卦页调用
        try{ localStorage.setItem('wnlResult', JSON.stringify(result)); }catch(e){}
    }

    function escapeHtml(s){
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ============ 时间选择 ============
    function fillTimeSelects(){
        var hh='', mm='';
        for(var i=0;i<24;i++) hh += '<option value="'+i+'">'+p2(i)+'</option>';
        for(var j=0;j<60;j++) mm += '<option value="'+j+'">'+p2(j)+'</option>';
        selHour.innerHTML = hh;
        selMin.innerHTML = mm;
    }

    // ============ 自动定位 ============
    // 流程：GPS（手机快） → IP 定位（电脑无GPS兜底） → 默认北京基准
    btnLoc.addEventListener('click', function(){
        locMsg.textContent = '定位中';
        locMsg.className = 'loc-status loading';

        function onSuccess(lng, name, type){
            state.lng = lng;
            state.placeName = name ? (name + (type==='gps'?'（GPS）':'（IP）')) : ('经度 '+lng.toFixed(2));
            state.locationType = type;
            var placeText = name ? name : ('经度 '+lng.toFixed(2)+'°E');
            locMsg.textContent = '✅ 定位成功　' + placeText + '　经度 ' + lng.toFixed(2) + '°E　真太阳时已重新计算';
            locMsg.className = 'loc-status success';
            render();
        }
        function tryIp(i){
            var apis = [
                { url:'https://ipwho.is/',
                  parse:function(j){ return j.longitude!=null ? {lng:+j.longitude, name:(j.city||j.region||j.country||'当前城市')} : null; } },
                { url:'https://ipapi.co/json/?lang=zh-CN',
                  parse:function(j){ return j.longitude!=null ? {lng:+j.longitude, name:(j.city||j.region||j.country_name||'当前城市')} : null; } }
            ];
            if(i >= apis.length){
                locMsg.textContent = '⚠️ GPS 与 IP 定位均失败，已使用默认北京基准（116.41°E）';
                locMsg.className = 'loc-status';
                state.placeName = '北京基准（默认）';
                state.locationType = 'fallback';
                render();
                return;
            }
            var api = apis[i];
            locMsg.textContent = 'IP 定位中…（源 '+(i+1)+'/'+apis.length+'）';
            fetch(api.url, {method:'GET', cache:'no-store', mode:'cors'})
                .then(function(r){
                    if(!r.ok) throw new Error('http '+r.status);
                    return r.json();
                })
                .then(function(j){
                    var p = api.parse(j);
                    if(!p || isNaN(p.lng)) throw new Error('no-lng');
                    onSuccess(p.lng, p.name, 'ip');
                })
                .catch(function(){
                    tryIp(i+1);
                });
        }
        function tryGps(){
            if(!navigator.geolocation){
                locMsg.textContent = '当前环境不支持 GPS，改用 IP 定位…';
                return tryIp(0);
            }
            navigator.geolocation.getCurrentPosition(function(pos){
                var lat = pos.coords.latitude, lng = pos.coords.longitude;
                // GPS 只给经纬度，再逆地理编码一次拿到城市名
                reverseGeocode(lat, lng, function(city){
                    onSuccess(lng, city, 'gps');
                });
            }, function(){
                locMsg.textContent = 'GPS 不可用，改用 IP 定位…';
                tryIp(0);
            }, { enableHighAccuracy:false, timeout:6000, maximumAge:600000 });
        }
        // 逆地理编码：经纬度 -> 城市名（免 key，浏览器友好）
        function reverseGeocode(lat, lng, cb){
            var url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='
                + lat + '&longitude=' + lng + '&localityLanguage=zh';
            fetch(url, {method:'GET', cache:'no-store', mode:'cors'})
                .then(function(r){ return r.json(); })
                .then(function(j){
                    var city = j.city || j.locality || j.principalSubdivision || null;
                    cb(city);
                })
                .catch(function(){ cb(null); });
        }
        tryGps();
    });
    selHour.addEventListener('change', function(){ state.h=parseInt(selHour.value); render(); });
    selMin.addEventListener('change', function(){ state.mi=parseInt(selMin.value); render(); });

    // ============ 初始化 ============
    function init(){
        var now = new Date();
        state.y = now.getFullYear();
        state.m = now.getMonth()+1;
        state.d = now.getDate();
        state.h = now.getHours();
        state.mi = now.getMinutes();

        fillTimeSelects();
        selHour.value = state.h;
        selMin.value = state.mi;

        // 日期输入框初始值（补零显示）
        inpYear.value = String(state.y);
        inpMonth.value = state.m < 10 ? '0' + state.m : '' + state.m;
        inpDay.value = state.d < 10 ? '0' + state.d : '' + state.d;

        render();
        console.log('✅ 万年历排盘页已加载');
    }

    if(window.Solar){
        init();
    }else{
        resultArea.innerHTML = '<div style="color:#b33;text-align:center;padding:20px;">⚠️ lunar.js 未加载，无法排盘</div>';
    }
})();
</script>
