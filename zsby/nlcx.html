<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农历查询 · 增删卜易</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #e8f1f2;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(205, 224, 228, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 228, 232, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(195, 216, 220, 0.45) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 0%, rgba(210, 226, 230, 0.35) 0%, transparent 30%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '☯';
            position: fixed;
            font-size: 250px;
            color: rgba(255, 248, 240, 0.03);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: taijiSpin 50s linear infinite;
        }
        @keyframes taijiSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.1); }
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(2px 2px at 10% 20%, rgba(255,255,240,0.12), transparent),
                radial-gradient(1px 1px at 30% 60%, rgba(255,255,240,0.08), transparent),
                radial-gradient(2px 2px at 50% 10%, rgba(255,255,240,0.15), transparent),
                radial-gradient(1px 1px at 70% 40%, rgba(255,255,240,0.10), transparent),
                radial-gradient(2px 2px at 90% 80%, rgba(255,255,240,0.12), transparent);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 780px;
            width: 100%;
            background: rgba(246, 239, 230, 0.92);
            backdrop-filter: blur(12px);
            padding: 30px 30px 40px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px #6b5a48 inset, 0 0 0 2px #bcab97 inset;
            border: 1px solid #c9b9a5;
            align-self: center;
        }
        h1 {
            font-size: 26px;
            text-align: center;
            font-weight: normal;
            letter-spacing: 8px;
            color: #3f2e1e;
            text-shadow: 1px 1px 0 #d6c8b8;
            border-bottom: 2px solid #cbb8a4;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-bar a {
            color: #6b4f39;
            text-decoration: none;
            padding: 6px 18px;
            border-radius: 30px;
            background: #ede3d7;
            border: 1px solid #d5c6b4;
            font-size: 14px;
            transition: 0.2s;
        }
        .nav-bar a:hover { background: #d5c6b4; }
        .nav-bar a.active {
            background: #6b4f39;
            color: #f5ede4;
            border-color: #6b4f39;
        }
        .nav-bar a.external-link { background: #ede3d7; color: #6b4f39; border-color: #d5c6b4; }
        .nav-bar a.external-link:hover { background: #d5c6b4; color: #3f2e1e; border-color: #c2b39c; }
        .search-area {
            background: rgba(255, 248, 240, 0.6);
            border-radius: 20px;
            padding: 20px 24px;
            border: 1px solid #d5c6b4;
            margin-bottom: 20px;
            position: relative;   /* 作为自定义日期选择器的定位容器 */
        }
        .search-area .title {
            font-size: 14px;
            color: #7a6652;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-align: center;
        }
        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .search-row input[type="date"] {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid #cbb8a4;
            background: #fcf8f0;
            font-family: inherit;

        }
        .search-row input[type="date"]:focus {

        .btn-group {

        .btn {

        .result-grid {

        .result-card .label {

            color: #7a6652;

            margin-bottom: 4px;
        }
        .result-card .value {

            color: #3f2e1e;
        }
        .result-card .value.small {
            font-size: 16px;
        }
        .result-card .value .highlight {
            color: #6b4f39;
        }
        .result-card.full {
            grid-column: 1 / -1;
        }
        .result-card .sub {
            font-size: 13px;

        }
        .result-card .tag {

        }
        .footer-note {

            color: #a48d78;

            border-top: 1px solid #e0d3c4;
            padding-top: 16px;

        }
        .gushi-text {
            text-align: center;

        /* ============================================================
           // 新增：手机端自定义日期选择器（与页面主题一致）
           // 仅在手机端（isMobile）显示，桌面端仍用原生 date 输入
           ============================================================ */
        .date-picker {
            display: none;

            left: 12px; right: 12px; top: calc(100% + 6px);
            background: #fcf8f0;

            box-shadow: 0 12px 30px rgba(0,0,0,0.18);

        }
        .date-picker .dp-header {
            display: flex; align-items: center; justify-content: space-between;

        }
        .date-picker .dp-title { font-size: 15px; color: #3f2e1e; font-weight: bold; }
        .date-picker .dp-nav {
            background: #ede3d7; border: 1px solid #d5c6b4; color: #6b4f39;
            border-radius: 50%; width: 30px; height: 30px; font-size: 15px; cursor: pointer;
            line-height: 1; font-family: inherit;
        }
        .date-picker .dp-nav:hover { background: #d5c6b4; }
        .date-picker .dp-week, .date-picker .dp-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
        }
        .date-picker .dp-week span {
            text-align: center; font-size: 12px; color: #7a6652; padding: 4px 0;
        }
        .date-picker .dp-day {
            text-align: center; font-size: 14px; color: #3f2e1e;
            padding: 8px 0; border-radius: 8px; cursor: pointer; background: #f6efe6;
            border: 1px solid transparent;
        }
        .date-picker .dp-day:hover { background: #f0e8dd; }
        .date-picker .dp-day.dp-today { border-color: #8a765d; }
        .date-picker .dp-day.dp-selected { background: #6b4f39; color: #f5ede4; }
        .date-picker .dp-footer {
            display: flex; gap: 10px; margin-top: 10px;
        }
        .date-picker .dp-btn {
            flex: 1; padding: 9px 0; border-radius: 20px; font-size: 14px; cursor: pointer;
            font-family: inherit; border: 1px solid #c9b49e;
        }
        .date-picker .dp-ok { background: #6b4f39; color: #f5ede4; border-color: #8f745b; }
        .date-picker .dp-clear { background: #ede3d7; color: #6b4f39; }
        @media (max-width: 500px) {
            body { padding: 4px; }
            .container { padding: 8px; border-radius: 24px 24px 16px 16px; }
            h1 { font-size: 20px; letter-spacing: 4px; }
            /* 导航栏统一 3+3：每个按钮占 1/3 宽度，居中 */
            .nav-bar { gap: 6px; justify-content: center; }
            .nav-bar a {
                flex: 1 1 calc(33.33% - 8px);
                text-align: center;
                min-width: 0;
                font-size: 12px;
                padding: 6px 4px;
            }
            .search-area { padding: 14px 12px; }
            .search-row { flex-direction: column; gap: 8px; }
            .search-row input[type="date"] { min-width: 100%; }
            /* 四个按钮（查询/今日/◀/▶）挤在一行：取消换行、缩小 padding、缩小间距 */
            .btn-group {
                width: 100%;
                justify-content: center;
                gap: 6px;
                flex-wrap: nowrap;
            }
            .btn { padding: 8px 14px; font-size: 13px; }
            .btn-primary { padding: 7px 14px; font-size: 13px; }
            .btn-small { padding: 6px 10px; font-size: 13px; }

            .result-card .value { font-size: 17px; }
            .result-card { padding: 12px 14px; }
        }
        @media (max-width: 400px) {
            body { padding: 2px; }
            .container { padding: 6px; }
            h1 { font-size: 17px; letter-spacing: 2px; }
            .nav-bar a { font-size: 11px; padding: 5px 3px; }
            .btn { padding: 7px 10px; font-size: 12px; }
            .btn-primary { padding: 6px 10px; font-size: 12px; }
            .btn-small { padding: 5px 8px; font-size: 12px; }
            .btn-group { gap: 4px; }
        }

</head>

<div class="container">
    <h1>📅 农历 · 查询</h1>

    <div class="nav-bar">
        <a href="liuyao_divine.html">🔮 起卦</a>
        <a href="jiegu.html">📜 释卦</a>

        <a href="../index1.html" target="_blank" class="external-link" title="返回道玄文集">🏠 文集</a>
    </div>

    <div class="search-area">
        <div class="title">📆 选择公历日期，查询对应的农历信息</div>
        <div class="search-row">
            <input type="date" id="dateInput">
            <div class="btn-group">
                <button class="btn btn-primary" id="queryBtn">🔍 查询</button>
                <button class="btn btn-small" id="todayBtn">📌 今日</button>
                <button class="btn btn-small" id="prevBtn">◀</button>
                <button class="btn btn-small" id="nextBtn">▶</button>
            </div>
        </div>
        <!-- 手机端自定义日期选择器（桌面端隐藏，由 JS 控制显示） -->
        <div class="date-picker" id="datePicker"></div>
    </div>

    <div class="result-area" id="resultArea">
        <div class="result-placeholder">
            <span class="icon">🌿</span>
            请选择日期，查询农历信息
        </div>
    </div>

    <div class="footer-note">📖 以《增删卜易》为宗 · 干支纪年 · 节气时令</div>
</div>

<script src="../lunar.js"></script>
<script>
    (function() {
        const dateInput = document.getElementById('dateInput');
        const queryBtn = document.getElementById('queryBtn');
        const todayBtn = document.getElementById('todayBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resultArea = document.getElementById('resultArea');

        // ============================================================
        // 0. 手机端日期输入改造
        // 桌面端保留原生 type="date"（可输入可点选）；
        // 手机端改为 type="text" + 自定义主题选择器（解决原生选择器
        // 无法输入、且按钮文案/配色与系统不协调的问题）。
        // ============================================================
        const isMobile = window.matchMedia('(max-width: 500px)').matches;
        const datePicker = document.getElementById('datePicker');
        if (isMobile) {
            dateInput.type = 'text';
            dateInput.placeholder = 'YYYY-MM-DD（可输入或点选）';
        }

        // ============================================================
        // 1. 设置默认日期为今天
        // ============================================================
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${year}-${month}-${day}`;

        // ============================================================
        // 2. 查询函数
        // ============================================================
        function queryLunar(dateStr) {
            if (!dateStr) {
                resultArea.innerHTML = `
                    <div class="result-placeholder">
                        <span class="icon">⚠️</span>
                        请选择日期
                    </div>
                `;
                return;
            }

            try {
                const parts = dateStr.split('-').map(Number);
                const solar = Solar.fromYmd(parts[0], parts[1], parts[2]);
                if (!solar) {
                    throw new Error('无效日期');
                }

                const lunar = solar.getLunar();

                // ============================================================
                // 修复点：solar.getConstellation → lunar.getXingZuo()
                // ============================================================
                const data = {
                    solarYear: solar.getYear(),
                    solarMonth: solar.getMonth(),
                    solarDay: solar.getDay(),
                    week: ['日', '一', '二', '三', '四', '五', '六'][solar.getWeek()],
                    lunarYear: lunar.getYear(),
                    lunarYearChinese: lunar.getYearInChinese(),
                    lunarMonth: lunar.getMonth(),
                    lunarMonthChinese: lunar.getMonthInChinese(),
                    lunarDay: lunar.getDay(),
                    lunarDayChinese: lunar.getDayInChinese(),
                    animal: lunar.getAnimal(),
                    yearGanZhi: lunar.getYearInGanZhi(),
                    monthGanZhi: lunar.getMonthInGanZhi(),
                    dayGanZhi: lunar.getDayInGanZhi(),
                    jieQi: lunar.getJieQi ? lunar.getJieQi() : '—',
                    festivals: lunar.getFestivals ? lunar.getFestivals() : [],
                    isLeap: lunar.isLeapMonth ? lunar.isLeapMonth() : false,
                    // ✅ 修复：星座从 lunar 获取
                    constellation: lunar.getXingZuo ? lunar.getXingZuo() : '—'
                };

                // ============================================================
                // 新增：计算旬空与月破（六爻断卦核心要素）
                // 注意：必须在 data 对象构建完成后赋值，不能在对象字面量内
                // 引用尚未定义的 data 本身
                // ============================================================
                data.xunKong = getXunKong(data.dayGanZhi);          // 旬空：依日柱干支推算
                data.yuePo = getYuePo(data.monthGanZhi.charAt(1));  // 月破：依月柱地支相冲推算

                renderResult(data);

            } catch(e) {
                resultArea.innerHTML = `
                    <div class="error-msg">
                        ⚠️ 查询失败：${e.message || '请检查日期是否正确'}
                    </div>
                `;
                console.error('查询错误:', e);
            }
        }

        // ============================================================
        // 2.5 新增：六爻专用计算函数（旬空 / 月破）
        // ============================================================

        // 1. 计算旬空（根据日柱干支）
        //    原理：干支纪日每 10 日为一旬，旬首必为「甲×」；
        //    该旬未轮到的两个地支即为旬空。
        function getXunKong(dayGanZhi) {
            const gan = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
            const zhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

            const dayGan = dayGanZhi.charAt(0);
            const dayZhi = dayGanZhi.charAt(1);

            const ganIndex = gan.indexOf(dayGan);
            const zhiIndex = zhi.indexOf(dayZhi);

            // 计算旬首（甲子、甲戌等）。旬首天干恒为「甲」，故 xunShouIndex 恒为 0
            const xunShouIndex = ganIndex - (ganIndex % 10 === 0 ? 0 : (ganIndex % 10));
            // 旬首对应的地支索引
            const xunShouZhiIndex = zhiIndex - (ganIndex % 10);

            // 旬空的地支索引（旬末之后两位）
            const kong1Index = (xunShouZhiIndex + 10) % 12;
            const kong2Index = (xunShouZhiIndex + 11) % 12;

            return zhi[kong1Index] + zhi[kong2Index];
        }

        // 2. 计算月破（根据地支六冲关系）
        //    原理：月建（月柱地支）所冲之地支即为月破。
        function getYuePo(monthZhi) {
            const chongMap = {
                '子': '午', '丑': '未', '寅': '申', '卯': '酉',
                '辰': '戌', '巳': '亥', '午': '子', '未': '丑',
                '申': '寅', '酉': '卯', '戌': '辰', '亥': '巳'
            };
            return chongMap[monthZhi] || '—';
        }

        // ============================================================
        // 3. 渲染结果
        // ============================================================
        function renderResult(data) {
            const leapLabel = data.isLeap ? '（闰月）' : '';

            let festivalsHtml = '';
            if (data.festivals && data.festivals.length > 0) {
                festivalsHtml = data.festivals.map(f => `<span class="tag">${f}</span>`).join(' ');
            } else {
                festivalsHtml = '<span style="color:#b09a84;font-size:13px;">—</span>';
            }

            const poems = [
                '月有阴晴圆缺，人有旦夕祸福。',
                '春有百花秋有月，夏有凉风冬有雪。',
                '天行健，君子以自强不息。',
                '地势坤，君子以厚德载物。',
                '一阴一阳之谓道。',
                '天地交而万物通。',
                '日月运行，一寒一暑。',
                '观乎天文，以察时变。'
            ];
            const randomPoem = poems[Math.floor(Math.random() * poems.length)];

            const html = `
                <div class="result-content">
                    <div class="result-grid">
                        <div class="result-card">
                            <div class="label">📅 公历</div>
                            <div class="value">
                                ${data.solarYear}年${data.solarMonth}月${data.solarDay}日
                                <span style="font-size:16px;color:#7a6652;font-weight:normal;">
                                    星期${data.week}
                                </span>
                            </div>
                            <div class="sub">星座：${data.constellation || '—'}</div>
                        </div>

                        <div class="result-card">
                            <div class="label">🌙 农历</div>
                            <div class="value">
                                ${data.lunarYearChinese}年
                                ${data.lunarMonthChinese}月
                                ${data.lunarDayChinese}
                            </div>
                            <div class="sub">
                                   ${leapLabel}
                                  （对应公历：${data.solarYear}年${data.solarMonth}月${data.solarDay}日）
                              </div>
                        </div>

                        <div class="result-card">
                            <div class="label">🐾 生肖</div>
                            <div class="value">${data.animal}</div>
                            <div class="sub">${data.yearGanZhi}年</div>
                        </div>

                        <div class="result-card">
                            <div class="label">🧮 干支纪日</div>
                            <div class="value small">
                                ${data.yearGanZhi} · ${data.monthGanZhi} · ${data.dayGanZhi}
                            </div>
                            <div class="sub">年柱 · 月柱 · 日柱</div>
                        </div>

                        <div class="result-card full">
                            <div class="label">🕳️ 旬空 & 月破</div>
                            <div class="value small">
                                旬空：<span class="highlight">${data.xunKong}</span> &nbsp;|&nbsp; 月破：<span class="highlight">${data.yuePo}</span>
                            </div>
                            <div class="sub">六爻断卦核心要素 · 旬空为日辰所缺，月破为月建相冲</div>
                        </div>

                        <div class="result-card full">
                            <div class="label">🌿 节气</div>
                            <div class="value small">${data.jieQi}</div>
                            <div class="sub">当日节气</div>
                        </div>

                        <div class="result-card full">
                            <div class="label">🎉 节日</div>
                            <div>${festivalsHtml}</div>
                            <div class="sub" style="margin-top:4px;">传统节日 · 纪念日</div>
                        </div>
                    </div>
                    <div class="gushi-text">
                        <span class="quote">「${randomPoem}」</span>
                    </div>
                </div>
            `;
            resultArea.innerHTML = html;
        }

        // ============================================================
        // 3.5 手机端自定义日期选择器逻辑
        // ============================================================
        let pickerYear, pickerMonth, pickerSelectedDay;

        // 解析输入框中的 YYYY-MM-DD；失败则用今天
        function parseInput() {
            const m = dateInput.value && dateInput.value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (m) return { year: +m[1], month: +m[2], day: +m[3] };
            const t = new Date();
            return { year: t.getFullYear(), month: t.getMonth() + 1, day: t.getDate() };
        }

        function fmtDate(y, mo, d) {
            return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        }

        function changeMonth(delta) {
            pickerMonth += delta;
            if (pickerMonth < 1) { pickerMonth = 12; pickerYear--; }
            if (pickerMonth > 12) { pickerMonth = 1; pickerYear++; }
            renderPicker();
        }

        function renderPicker() {
            const today = new Date();
            const firstWeekday = new Date(pickerYear, pickerMonth - 1, 1).getDay(); // 0=日
            const daysInMonth = new Date(pickerYear, pickerMonth, 0).getDate();
            let cells = '';
            for (let i = 0; i < firstWeekday; i++) cells += '<span></span>';
            for (let d = 1; d <= daysInMonth; d++) {
                let cls = 'dp-day';
                if (d === today.getDate() && pickerMonth === today.getMonth() + 1 && pickerYear === today.getFullYear()) cls += ' dp-today';
                if (d === pickerSelectedDay) cls += ' dp-selected';
                cells += `<span class="${cls}" data-day="${d}">${d}</span>`;
            }
            datePicker.innerHTML = `
                <div class="dp-header">
                    <button type="button" class="dp-nav" data-nav="prevYear">«</button>
                    <span class="dp-title">${pickerYear}年</span>
                    <button type="button" class="dp-nav" data-nav="nextYear">»</button>
                </div>
                <div class="dp-header">
                    <button type="button" class="dp-nav" data-nav="prevMonth">‹</button>
                    <span class="dp-title">${String(pickerMonth).padStart(2, '0')}月</span>
                    <button type="button" class="dp-nav" data-nav="nextMonth">›</button>
                </div>
                <div class="dp-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
                <div class="dp-grid">${cells}</div>
                <div class="dp-footer">
                    <button type="button" class="dp-btn dp-clear" id="dpClear">清除</button>
                    <button type="button" class="dp-btn dp-ok" id="dpOk">确定</button>
                </div>
            `;
        }

        function openPicker() {
            if (!isMobile) return;
            const cur = parseInput();
            pickerYear = cur.year; pickerMonth = cur.month; pickerSelectedDay = cur.day;
            renderPicker();
            datePicker.style.display = 'block';
        }

        function closePicker() {
            datePicker.style.display = 'none';
        }

        // 事件委托：导航 / 选日 / 确定 / 清除
        datePicker.addEventListener('click', function(e) {
            const nav = e.target.dataset.nav;
            if (nav === 'prevYear') { pickerYear--; renderPicker(); return; }
            if (nav === 'nextYear') { pickerYear++; renderPicker(); return; }
            if (nav === 'prevMonth') { changeMonth(-1); return; }
            if (nav === 'nextMonth') { changeMonth(1); return; }
            if (e.target.classList.contains('dp-day') && e.target.dataset.day) {
                pickerSelectedDay = +e.target.dataset.day;
                renderPicker();
                return;
            }
            if (e.target.id === 'dpOk') {
                if (pickerSelectedDay) {
                    dateInput.value = fmtDate(pickerYear, pickerMonth, pickerSelectedDay);
                    queryLunar(dateInput.value);
                }
                closePicker();
                return;
            }
            if (e.target.id === 'dpClear') {
                dateInput.value = '';   // 清除选择（仅保留一个按钮，无"取消"）
                closePicker();
                return;
            }
        });

        // ============================================================
        // 4. 事件绑定
        // ============================================================
        queryBtn.addEventListener('click', function() {
            queryLunar(dateInput.value);
        });

        todayBtn.addEventListener('click', function() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            dateInput.value = `${y}-${m}-${d}`;
            queryLunar(dateInput.value);
        });

        prevBtn.addEventListener('click', function() {
            const current = new Date(dateInput.value + 'T00:00:00');
            if (isNaN(current.getTime())) {
                todayBtn.click();
                return;
            }
            current.setDate(current.getDate() - 1);
            const y = current.getFullYear();
            const m = String(current.getMonth() + 1).padStart(2, '0');
            const d = String(current.getDate()).padStart(2, '0');
            dateInput.value = `${y}-${m}-${d}`;
            queryLunar(dateInput.value);
        });

        nextBtn.addEventListener('click', function() {
            const current = new Date(dateInput.value + 'T00:00:00');
            if (isNaN(current.getTime())) {
                todayBtn.click();
                return;
            }
            current.setDate(current.getDate() + 1);
            const y = current.getFullYear();
            const m = String(current.getMonth() + 1).padStart(2, '0');
            const d = String(current.getDate()).padStart(2, '0');
            dateInput.value = `${y}-${m}-${d}`;
            queryLunar(dateInput.value);
        });

        dateInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                queryLunar(dateInput.value);
            }
        });

        // 手机端：聚焦输入框即弹出自定义选择器（同时仍可手动输入）
        if (isMobile) {
            dateInput.addEventListener('focus', openPicker);
            // 点击页面其它区域时收起选择器
            document.addEventListener('click', function(e) {
                if (datePicker.style.display === 'block' &&
                    !datePicker.contains(e.target) && e.target !== dateInput) {
                    closePicker();
                }
            });
        }

        setTimeout(function() {
            queryLunar(dateInput.value);
        }, 100);

        console.log('✅ 农历查询页面已加载');
    })();
</script>
</body>
</html>
