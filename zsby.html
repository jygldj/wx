            let baseText = lines[key] || (isYang ? "阳刚进取，宜守正道。" : "阴柔顺承，宜静不宜动。");
            
            if (isMoving) {
                return `<span class="text-[#8B0000] font-bold">${key}：${baseText}</span> <span class="text-xs text-gray-500">(动爻)</span>`;
            }
            return `${key}：${baseText}`;
        }

        // --- Core Logic ---

        const btnCast = document.getElementById('btnCast');
        const statusMsg = document.getElementById('statusMsg');
        const resultContainer = document.getElementById('resultContainer');
        const placeholderState = document.getElementById('placeholderState');
        const resultContent = document.getElementById('resultContent');

        btnCast.addEventListener('click', async () => {
            const question = document.getElementById('userQuestion').value.trim();
            const type = document.getElementById('questionType').value;
            
            if (!question) {
                statusMsg.textContent = "请先输入您所问之事。";
                statusMsg.className = "mt-4 text-center text-red-600 text-sm h-5";
                return;
            }

            // UI State: Loading
            btnCast.disabled = true;
            btnCast.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在起卦...';
            statusMsg.textContent = "心诚则灵，正在感应天地...";
            statusMsg.className = "mt-4 text-center text-[#8B0000] text-sm h-5";

            // Simulate delay for "ritual" feel
            await new Promise(r => setTimeout(r, 1500));

            // 1. Generate Hexagram
            const result = tossCoins();
            
            // 2. Render Results
            renderResult(result, type);

            // UI State: Reset
            btnCast.disabled = false;
            btnCast.innerHTML = '<i class="fa-solid fa-coins"></i> 再次摇卦';
            statusMsg.textContent = "";
        });

        function tossCoins() {
            // Lines: Array of 6 objects. Index 0 is bottom (Line 1), Index 5 is top (Line 6)
            // Coin Logic:
            // 1 Back (Yang), 2 Front (Yin) -> Yin (少阴) - - (Value 2)
            // 2 Back (Yang), 1 Front (Yin) -> Yang (少阳) — (Value 3)
            // 3 Back (Yang) -> Old Yang (老阳) — O (Value 4) -> Changes to Yin
            // 3 Front (Yin) -> Old Yin (老阴) - - X (Value 5) -> Changes to Yang
            
            let lines = [];
            let mainBinary = ""; // Top to Bottom
            let changedBinary = "";

            for (let i = 0; i < 6; i++) {
                const r = Math.floor(Math.random() * 4); // 0, 1, 2, 3
                let type = ""; // 'yang', 'yin', 'old-yang', 'old-yin'
                let val = 0;   // 1 for Yang, 0 for Yin

                switch(r) {
                    case 0: // 1 Back (Yin)
                        type = 'yin';
                        val = 0;
                        break;
                    case 1: // 2 Back (Yang)
                        type = 'yang';
                        val = 1;
                        break;
                    case 2: // 3 Back (Old Yang)
                        type = 'old-yang';
                        val = 1;
                        break;
                    case 3: // 3 Front (Old Yin)
                        type = 'old-yin';
                        val = 0;
                        break;
                }
                
                lines.push({ type: type, value: val, index: i });
            }

            // Construct binary strings (Top to Bottom)
            // lines array is 0(bottom) to 5(top). So we reverse for string.
            let mainArr = [...lines].reverse().map(l => l.value);
            let changedArr = [...lines].reverse().map(l => {
                if (l.type === 'old-yang') return 0; // Yang changes to Yin
                if (l.type === 'old-yin') return 1; // Yin changes to Yang
                return l.value;
            });

            return {
                lines: lines,
                mainBinary: mainArr.join(''),
                changedBinary: changedArr.join('')
            };
        }

        function renderResult(result, questionType) {
            // Hide placeholder, show content
            placeholderState.classList.add('hidden');
            resultContent.classList.remove('hidden');
            resultContent.classList.add('fade-in');

            // 1. Visuals
            const mainInfo = getHexagramInfo(result.mainBinary);
            const changedInfo = getHexagramInfo(result.changedBinary);

            document.getElementById('mainHexagramName').textContent = mainInfo.name;
            document.getElementById('mainHexagramNature').textContent = `${mainInfo.nature}卦`;
            
            document.getElementById('changedHexagramName').textContent = changedInfo.name;
            document.getElementById('changedHexagramNature').textContent = `${changedInfo.nature}卦`;

            document.getElementById('mainHexagramVisual').innerHTML = renderHexagramSVG(result.lines, 'main');
            document.getElementById('changedHexagramVisual').innerHTML = renderHexagramSVG(result.lines, 'changed');

            // 2. Judgment (Zeng Shan Bu Yi Logic)
            const judgment = generateJudgment(result, mainInfo, changedInfo, questionType);
            document.getElementById('judgmentText').innerHTML = judgment;

            // 3. Yao Lines
            const yaoContainer = document.getElementById('yaoLinesContainer');
            yaoContainer.innerHTML = '';
            
            // Render from Top (Line 6) to Bottom (Line 1) for reading, or Bottom to Top?
            // Standard is reading Top to Bottom text usually, but lines are built Bottom to Top.
            // Let's display Top to Bottom (Line 6 -> Line 1) as is traditional in text lists.
            for (let i = 5; i >= 0; i--) {
                const line = result.lines[i];
                const isYang = line.value === 1;
                const isMoving = line.type.includes('old');
                const text = getYaoText(i, isYang, isMoving);
                
                const div = document.createElement('div');
                div.className = `p-2 rounded border ${isMoving ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-100'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-8 text-center">${isYang ? '—' : '--'}</span>
                        <span>${text}</span>
                    </div>
                `;
                yaoContainer.appendChild(div);
            }
        }

        function renderHexagramSVG(lines, mode) {
            // mode: 'main' or 'changed'
            // lines array is 0(bottom) to 5(top).
            // We need to render HTML elements.
            
            let html = '<div class="flex flex-col-reverse gap-1">'; // CSS flex-col-reverse makes index 0 at bottom visually
            
            for (let i = 0; i < 6; i++) {
                const line = lines[i];
                let typeToRender = line.type;
                
                if (mode === 'changed') {
                    if (line.type === 'old-yang') typeToRender = 'yin';
                    if (line.type === 'old-yin') typeToRender = 'yang';
                }

                let lineClass = 'hexagram-line ';
                let content = '';

                if (typeToRender === 'yang' || typeToRender === 'old-yang') {
                    lineClass += 'yang-line';
                    if (mode === 'main' && typeToRender === 'old-yang') lineClass += ' old-yang';
                } else {
                    lineClass += 'yin-line';
                    content = '<div class="yin-segment"></div><div class="yin-segment"></div>';
                    if (mode === 'main' && typeToRender === 'old-yin') lineClass += ' old-yin';
                }

                html += `<div class="${lineClass}">${content}</div>`;
            }
            html += '</div>';
            return html;
        }

        function generateJudgment(result, mainInfo, changedInfo, type) {
            // Zeng Shan Bu Yi Logic Simulation
            let analysis = [];
            
            // 1. Check for Six Clashing (Liu Chong)
            // Upper and Lower Trigrams are opposites (e.g. Qian/Kun, Kan/Li, Zhen/Dui, Xun/Gen)
            const isSixClashing = checkSixClashing(mainInfo);
            
            if (isSixClashing) {
                analysis.push(`<strong>【卦象格局】</strong> 主卦为六冲卦 (${mainInfo.name})。`);
                if (type === 'health') {
                    analysis.push(`野鹤老人曰：近病逢冲，不药而愈；久病逢冲，灵丹莫救。若非久年顽疾，此卦主冲散病气，近期有望康复。`);
                } else {
                    analysis.push(`六冲卦主散，凡事难成，吉凶不久。利于冲散灾祸，但不利于求财、婚姻等长久之事。`);
                }
            } else {
                analysis.push(`<strong>【卦象格局】</strong> 主卦为${mainInfo.name}，变卦为${changedInfo.name}。`);
            }

            // 2. Check Moving Lines (Dong Yao)
            const movingLines = result.lines.filter(l => l.type.includes('old'));
            if (movingLines.length > 0) {
                analysis.push(`<strong>【动爻分析】</strong> 卦中有 ${movingLines.length} 爻动。`);
                movingLines.forEach(l => {
                    const posName = ["初", "二", "三", "四", "五", "上"][l.index];
                    analysis.push(`${posName}爻动，主事态有变。`);
                });
            } else {
                analysis.push(`<strong>【动爻分析】</strong> 六爻安静，主事态稳定，目前没有大的变动。`);
            }

            // 3. Use God (Yong Shen) Analysis (Simplified)
            analysis.push(`<br><strong>【增删卜易断语】</strong>`);
            
            switch(type) {
                case 'wealth':
                    if (mainInfo.lower.nature === '水' || mainInfo.upper.nature === '水') {
                        analysis.push(`财星（水）得势。若兄弟爻不动，求财有望。`);
                    } else {
                        analysis.push(`财星休囚，需防兄弟劫财。此时不宜大额投资，宜守成。`);
                    }
                    if (movingLines.some(l => l.type === 'old-yin')) {
                        analysis.push(`老阴动化为阳，暗财有变，需防虚惊。`);
                    }
                    break;
                case 'career':
                    if (mainInfo.lower.nature === '金' || mainInfo.upper.nature === '金') {
                        analysis.push(`官鬼（金）持世或得生，功名易成，职场顺利。`);
                    } else {
                        analysis.push(`官星不显，世爻若空，目前时机未到，需待时而动。`);
                    }
                    break;
                case 'health':
                    if (isSixClashing) {
                        analysis.push(`逢六冲，近病即愈。`);
                    } else {
                        analysis.push(`需看用神。若子孙爻旺，虽有灾亦无咎；若官鬼爻旺且克世，则需速治。`);
                    }
                    break;
                default:
                    analysis.push(`世应相生则吉，相克则凶。变卦显示事情发展的最终趋势。`);
            }

            // 4. General Advice based on Zeng Shan Bu Yi principles
            analysis.push(`<br><strong>【建议】</strong>`);
            analysis.push(`野鹤老人云：“心诚则灵”。此卦已显，请勿反复占问（再三渎则不告）。`);
            if (changedInfo.name === "水火既济") {
                analysis.push(`变卦为既济，事情终将成功，但需防初吉终乱。`);
            } else if (changedInfo.name === "火水未济") {
                analysis.push(`变卦为未济，事未成，仍需努力。`);
            }

            return analysis.join('<br>');
        }

        function checkSixClashing(info) {
            // Qian(111) vs Kun(000)
            if ((info.upper.name === '乾' && info.lower.name === '坤') || 
                (info.upper.name === '坤' && info.lower.name === '乾')) return true;
            // Kan(010) vs Li(101)
            if ((info.upper.name === '坎' && info.lower.name === '离') || 
                (info.upper.name === '离' && info.lower.name === '坎')) return true;
            // Zhen(100) vs Dui(110) - Wait, binary 100 vs 110? No.
            // Standard 6 clashes: Qian-Kun, Kun-Qian, Dui-Zhen, Zhen-Dui, Li-Kan, Kan-Li, Xun-Gen, Gen-Xun
            const pairs = [
                ['乾', '坤'], ['坤', '乾'],
                ['兑', '震'], ['震', '兑'],
                ['离', '坎'], ['坎', '离'],
                ['巽', '艮'], ['艮', '巽']
            ];
            return pairs.some(p => p[0] === info.upper.name && p[1] === info.lower.name);
        }

    </script>
