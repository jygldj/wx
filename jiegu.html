<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卦象解读 · 增删卜易</title>
    <style>
        /* ===== 全局样式 ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #3d2e20;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(140, 100, 65, 0.35) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(200, 170, 130, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(120, 80, 50, 0.25) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 0%, rgba(80, 55, 40, 0.2) 0%, transparent 30%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* 太极阴阳鱼背景装饰 */
        body::before {
            content: '☯';
            position: fixed;
            font-size: 300px;
            color: rgba(255, 248, 240, 0.04);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: taijiSpin 60s linear infinite;
        }

        @keyframes taijiSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.2); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.2); }
        }

        /* 星点闪烁 */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(2px 2px at 10% 20%, rgba(255,255,240,0.15), transparent),
                radial-gradient(2px 2px at 30% 60%, rgba(255,255,240,0.1), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(255,255,240,0.2), transparent),
                radial-gradient(2px 2px at 70% 40%, rgba(255,255,240,0.12), transparent),
                radial-gradient(1px 1px at 90% 80%, rgba(255,255,240,0.18), transparent),
                radial-gradient(1px 1px at 15% 85%, rgba(255,255,240,0.08), transparent),
                radial-gradient(2px 2px at 60% 90%, rgba(255,255,240,0.1), transparent),
                radial-gradient(1px 1px at 85% 15%, rgba(255,255,240,0.15), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 840px;
            width: 100%;
            background: rgba(246, 239, 230, 0.92);
            backdrop-filter: blur(12px);
            padding: 30px 30px 40px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px #6b5a48 inset, 0 0 0 2px #bcab97 inset;
            border: 1px solid #c9b9a5;
        }
        h1 {
            font-size: 26px;
            text-align: center;
            font-weight: normal;
            letter-spacing: 8px;
            color: #3f2e1e;
            text-shadow: 1px 1px 0 #d6c8b8;
            border-bottom: 2px solid #cbb8a4;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-bar a {
            color: #6b4f39;
            text-decoration: none;
            padding: 6px 18px;
            border-radius: 30px;
            background: #ede3d7;
            border: 1px solid #d5c6b4;
            font-size: 14px;
            transition: 0.2s;
        }
        .nav-bar a:hover {
            background: #d5c6b4;
        }
        .nav-bar a.active {
            background: #6b4f39;
            color: #f5ede4;
            border-color: #6b4f39;
        }
        .info-area {
            background: #fcf8f0;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #d5c6b4;
            margin-bottom: 20px;
        }
        .info-area .label {
            font-size: 13px;
            color: #7a6652;
            letter-spacing: 2px;
        }
        .info-area .value {
            font-size: 20px;
            font-weight: bold;
            color: #3f2e1e;
            margin: 4px 0 10px;
        }
        .info-area .value .highlight {
            color: #b33;
        }
        .divider {
            border: none;
            border-top: 2px dashed #d5c6b4;
            margin: 12px 0;
        }
        .question-area {
            margin-top: 12px;
        }
        .question-area label {
            display: block;
            font-size: 14px;
            color: #6b5844;
            margin-bottom: 6px;
        }
        .question-area input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid #cbb8a4;
            background: #fcf8f0;
            font-family: inherit;
            color: #3c2e22;
        }
        .question-area input:focus {
            outline: none;
            border-color: #8a765d;
        }
        .action-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0 8px;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #6b4f39;
            border: none;
            color: #f5ede4;
            padding: 12px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #3d2d1f;
            border: 1px solid #8f745b;
            transition: 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            background: #7d5d43;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #3d2d1f;
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3d2d1f;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3d2d1f;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #b09a84;
            border: none;
            color: #2d241c;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #7a6652;
            border: 1px solid #c9b49e;
            transition: 0.2s;
        }
        .btn-secondary:hover {
            background: #c0aa94;
            transform: translateY(-2px);
        }
        #resultArea {
            margin-top: 20px;
            background: #f8f1e8;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #d5c6b4;
            min-height: 150px;
            transition: 0.3s;
            line-height: 1.8;
        }
        .result-placeholder {
            color: #9a8876;
            text-align: center;
            padding: 30px 0;
            font-style: italic;
            letter-spacing: 2px;
        }
        .result-content {
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .result-content .title {
            font-size: 18px;
            font-weight: bold;
            color: #3f2e1e;
            border-bottom: 1px solid #d5c6b4;
            padding-bottom: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .result-content .title .title-text { flex: 1; min-width: 0; }
        .result-content .title .action-btns { display: flex; gap: 8px; flex-shrink: 0; }
        .result-content .title .action-btn {
            font-family: inherit;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 14px;
            background: #ede3d7;
            color: #6b4f39;
            border: 1px solid #d5c6b4;
            cursor: pointer;
            transition: 0.2s;
        }
        .result-content .title .action-btn:hover {
            background: #d5c6b4;
            color: #3f2e1e;
        }
        .result-content .user-block {
            background: linear-gradient(135deg, rgba(107, 79, 57, 0.08) 0%, rgba(180, 150, 120, 0.05) 100%);
            border-left: 3px solid #8b6f4f;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 14px;
            font-size: 13px;
            line-height: 1.9;
            color: #5a4632;
        }
        .result-content .user-block .user-title {
            font-weight: bold;
            color: #3f2e1e;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .result-content .user-block .user-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .result-content .user-block .user-row span { white-space: nowrap; }
        .result-content .body {
            font-size: 15px;
            color: #3c2e22;
            white-space: pre-wrap;
        }
        .result-content .body .guaci {
            color: #6b4f39;
            font-weight: bold;
        }
        .loading-text {
            text-align: center;
            padding: 30px 0;
            color: #6b5844;
            font-style: italic;
        }
        .loading-text .spinner {
            display: inline-block;
            animation: spin 1.2s linear infinite;
            font-size: 28px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #a48d78;
            text-align: center;
            border-top: 1px solid #e0d3c4;
            padding-top: 16px;
            letter-spacing: 1px;
        }
        .model-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 8px 0 12px;
            flex-wrap: wrap;
        }
        .model-selector label {
            font-size: 14px;
            color: #6b5844;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .model-selector input[type="radio"] {
            accent-color: #6b4f39;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .time-info-display {
            background: #ede3d7;
            border-radius: 12px;
            padding: 10px 16px;
            margin: 10px 0 16px;
            font-size: 13px;
            color: #4d3b2b;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            justify-content: center;
            border: 1px solid #d5c6b4;
        }
        .time-info-display span {
            white-space: nowrap;
        }
        .time-info-display .label {
            color: #7a6652;
            margin-right: 4px;
        }
        @media (max-width: 500px) {
            .container { padding: 16px; }
            h1 { font-size: 20px; letter-spacing: 4px; }
            .nav-bar a { font-size: 12px; padding: 4px 12px; }
            .btn-primary { padding: 12px 24px; font-size: 16px; width: 100%; }
            .btn-secondary { padding: 12px 24px; font-size: 16px; width: 100%; }
            .action-row { flex-direction: column; gap: 10px; }
            .model-selector { gap: 6px; }
            .model-selector label { font-size: 13px; }
            .time-info-display {
                flex-direction: column;
                align-items: center;
                gap: 4px;
                font-size: 12px;
                padding: 8px 12px;
            }
            .info-area .value { font-size: 16px; }
            .result-content .title { flex-direction: column; align-items: flex-start; }
            .result-content .title .action-btns { width: 100%; }
            .result-content .title .action-btn { flex: 1; }
            .result-content .user-block { padding: 10px 12px; font-size: 12px; }
            .result-content .user-block .user-row { gap: 8px; }
        }

        @media (max-width: 400px) {
            .container { padding: 12px; }
            h1 { font-size: 17px; letter-spacing: 2px; }
            .result-content .title .action-btn { font-size: 11px; padding: 4px 8px; }
        }
    </style>
</head>

<!-- ========== 引入 lunar-javascript 库 ========== -->
<script src="lunar.js"></script>
<script src="config.js"></script>
<script src="api/glm.js"></script>
<script src="api/qwen.js"></script>

<script>
    (function() {
        // ============================================================
        // 1. 时间信息函数（基于 lunar-javascript）
        // ============================================================
        function getXunKong(riChen) {
            // 六十甲子表
            const ganZhi60 = [
                '甲子','乙丑','丙寅','丁卯','戊辰','己巳','庚午','辛未','壬申','癸酉',
                '甲戌','乙亥','丙子','丁丑','戊寅','己卯','庚辰','辛巳','壬午','癸未',
                '甲申','乙酉','丙戌','丁亥','戊子','己丑','庚寅','辛卯','壬辰','癸巳',
                '甲午','乙未','丙申','丁酉','戊戌','己亥','庚子','辛丑','壬寅','癸卯',
                '甲辰','乙巳','丙午','丁未','戊申','己酉','庚戌','辛亥','壬子','癸丑',
                '甲寅','乙卯','丙辰','丁巳','戊午','己未','庚申','辛酉','壬戌','癸亥'
            ];
            // 六甲旬空表（按旬序：甲子旬→戌亥，甲戌旬→申酉，...）
            const xunKong = ['戌亥', '申酉', '午未', '辰巳', '寅卯', '子丑'];
            const idx = ganZhi60.indexOf(riChen);
            if (idx === -1) return '—';
            return xunKong[Math.floor(idx / 10)];
        }

        function getTimeInfo() {
            const now = new Date();
            
            // 使用 lunar-javascript 库
            const solar = Solar.fromDate(now);
            const lunar = solar.getLunar();
            
            // 公历时间（精简格式）
            const year = solar.getYear();
            const month = String(solar.getMonth()).padStart(2, '0');
            const day = String(solar.getDay()).padStart(2, '0');
            const hour = String(solar.getHour()).padStart(2, '0');
            const minute = String(solar.getMinute()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekday = weekdays[solar.getWeek()];
            const solarTime = `${year}年${month}月${day}日 星期${weekday} ${hour}:${minute}`;
            
            // 农历时间（精简格式）
            const lunarYear = lunar.getYear();
            const lunarMonth = lunar.getMonthInChinese();
            const lunarDay = lunar.getDayInChinese();
            const lunarTime = `${lunarYear}年 ${lunarMonth}月${lunarDay}`;
            
            // 月建（月支）- 直接从 lunar 获取
            const yueJian = lunar.getMonthZhi() || '未知';
            
            // 日辰（日干支）- 直接从 lunar 获取
            const riChen = lunar.getDayInGanZhi() || '未知';
            
            // 旬空 - 直接从 lunar 库获取（库内置算法基于天干地支索引差，正确可靠）
            const xunKong = lunar.getDayXunKong() || '—';
            
            return {
                solarTime: solarTime,
                lunarTime: lunarTime,
                yueJian: yueJian,
                riChen: riChen,
                xunKong: xunKong
            };
        }

        // ============================================================
        // 2. 从 localStorage 读取当前卦象
        // ============================================================
        function loadGuaData() {
            try {
                const raw = localStorage.getItem('currentGua');
                if (!raw) return null;
                return JSON.parse(raw);
            } catch(e) {
                return null;
            }
        }

        function displayGuaInfo(guaData) {
            if (!guaData) {
                document.getElementById('guaDisplay').textContent = '尚未起卦，请先起卦';
                document.getElementById('benGuaName').textContent = '—';
                document.getElementById('bianGuaName').textContent = '—';
                document.getElementById('dongYaoInfo').textContent = '—';
                // 清空时间显示
                document.getElementById('displaySolarTime').textContent = '—';
                document.getElementById('displayLunarTime').textContent = '—';
                document.getElementById('displayYueJian').textContent = '—';
                document.getElementById('displayRiChen').textContent = '—';
                document.getElementById('displayXunKong').textContent = '—';
                return;
            }
            document.getElementById('guaDisplay').textContent = 
                `${guaData.benGuaName}（${guaData.benPalace}） → ${guaData.bianGuaName}（${guaData.bianPalace}）`;
            document.getElementById('benGuaName').textContent = guaData.benGuaName;
            document.getElementById('bianGuaName').textContent = guaData.bianGuaName;
            const dongList = guaData.dongYao.map(d => `${d}爻`).join('、');
            document.getElementById('dongYaoInfo').textContent = dongList || '无动爻（静卦）';

            // 获取并显示当前时间信息
            try {
                const timeInfo = getTimeInfo();
                document.getElementById('displaySolarTime').textContent = timeInfo.solarTime;
                document.getElementById('displayLunarTime').textContent = timeInfo.lunarTime;
                document.getElementById('displayYueJian').textContent = timeInfo.yueJian + '月';
                document.getElementById('displayRiChen').textContent = timeInfo.riChen + '日';
                document.getElementById('displayXunKong').textContent = timeInfo.xunKong;
            } catch(e) {
                console.warn('获取时间信息失败:', e);
            }
        }

        // ============================================================
        // 3. 解卦逻辑
        // ============================================================
        const resultArea = document.getElementById('resultArea');
        const jieGuaBtn = document.getElementById('jieGuaBtn');
        const backBtn = document.getElementById('backBtn');

        // 返回起卦页面
        backBtn.addEventListener('click', function() {
            window.location.href = 'liuyao_divine.html';
        });

        jieGuaBtn.addEventListener('click', async function() {
            const guaData = loadGuaData();
            if (!guaData) {
                resultArea.innerHTML = `
                    <div class="result-content">
                        <div style="color:#b33;text-align:center;padding:20px 0;">
                            ⚠️ 未找到卦象数据，请先起卦！
                        </div>
                    </div>
                `;
                return;
            }

            // 获取求卦者信息（从 localStorage 读取）
            let userInfo = {};
            try {
                userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
            } catch(e) {}
            const question = userInfo.question || '未提供具体问题，请综合解读';

            // 获取选中的模型
            const model = document.querySelector('input[name="model"]:checked').value;

            // 获取当前时间信息
            let timeInfo = {};
            try {
                timeInfo = getTimeInfo();
            } catch(e) {
                console.warn('获取时间信息失败，将不传递时间信息:', e);
            }

            // 显示加载状态
            resultArea.innerHTML = `
                <div class="loading-text">
                    <div class="spinner">☯</div>
                    <div style="margin-top:10px;">正在拨通野鹤老人电话，请他为你解卦，大约需要一分钟...</div>
                    <div style="font-size:13px;color:#9a8876;margin-top:4px;">模型：${model === 'qwen' ? '千问 3.7' : 'GLM-5（智谱）'}</div>
                </div>
            `;
            jieGuaBtn.disabled = true;

            try {
                // 构建卦象数据（包含时间信息和求卦者资料）
                const guaInfo = {
                    benGua: guaData.benGuaName,
                    benPalace: guaData.benPalace,
                    bianGua: guaData.bianGuaName,
                    bianPalace: guaData.bianPalace,
                    dongYao: guaData.dongYao,
                    yaoResults: guaData.yaoResults,
                    dongStatus: guaData.dongStatus,
                    benYao: guaData.benYao || [],
                    bianYao: guaData.bianYao || [],
                    question: question,
                    timeInfo: timeInfo,
                    userInfo: userInfo   // 求卦者完整资料（姓名、性别、出生时辰、所问之事）
                };

                // 调用对应模型的API
                      let result = '';
                      if (model === 'qwen') {
                           result = await callQwen(guaInfo);
                       } else if (model === 'glm') {
                           result = await callGLM(guaInfo);
                       }

                // 显示结果
                const timeText = `${timeInfo.solarTime || ''}（公历）${timeInfo.lunarTime || ''}（农历）`;
                const userText = `姓名：${userInfo.name || '匿名'}　性别：${userInfo.gender || '未知'}　出生时辰：${userInfo.birth || '未知'}`;
                const questionText = userInfo.question || '未提供具体问题，请综合解读';
                const modelName = model === 'qwen' ? '千问 3.7' : 'GLM-5（智谱）';

                resultArea.innerHTML = `
                    <div class="result-content" id="resultContent">
                        <div class="title">
                            <div class="title-text">
                                📜 卦象解读
                                <span style="font-size:13px;font-weight:normal;color:#7a6652;margin-left:12px;">
                                    本卦 ${guaData.benGuaName} → 变卦 ${guaData.bianGuaName}
                                </span>
                            </div>
                            <div class="action-btns">
                                <button class="action-btn" onclick="copyResult()" title="复制卦象解读全文">📋 复制</button>
                                <button class="action-btn" onclick="saveResult()" title="保存卦象解读全文">💾 保存</button>
                            </div>
                        </div>
                        <div class="user-block">
                            <div class="user-title">🧘 求卦者资料</div>
                            <div class="user-row">
                                <span>👤 ${userText}</span>
                            </div>
                            <div class="user-row">
                                <span>📅 起卦：${timeText}</span>
                            </div>
                            <div class="user-row">
                                <span>🌙 月建：${timeInfo.yueJian || '未知'}月　☀️ 日辰：${timeInfo.riChen || '未知'}日　🌀 旬空：${timeInfo.xunKong || '—'}</span>
                            </div>
                            <div class="user-row">
                                <span>❓ 所问：${questionText}</span>
                            </div>
                        </div>
                        <div class="body">${result}</div>
                        <div style="margin-top:14px;font-size:12px;color:#9a8876;border-top:1px solid #e0d3c4;padding-top:12px;">
                            🤖 AI 解读（${modelName}）· 仅供娱乐参考 · 决策还需理性判断
                        </div>
                    </div>
                `;

                // 保存纯文本（用于复制/下载）
                window.__guaResultText = `【卦象解读 · ${guaData.benGuaName} → ${guaData.bianGuaName}】
求卦者：${userText}
起卦时间：${timeText}
月建：${timeInfo.yueJian || '未知'}月　日辰：${timeInfo.riChen || '未知'}日　旬空：${timeInfo.xunKong || '—'}
所问之事：${questionText}

${result}

---
模型：${modelName}　时间：${new Date().toLocaleString('zh-CN')}
本解读仅供参考，决策需理性判断。`;

            } catch(error) {
                resultArea.innerHTML = `
                    <div class="result-content">
                        <div style="color:#b33;text-align:center;padding:20px 0;">
                            ⚠️ 解卦失败：${error.message || '请检查API配置'}
                        </div>
                        <div style="font-size:13px;color:#7a6652;text-align:center;margin-top:8px;">
                            💡 提示：请确保 config.js 中的 API_KEY 已正确配置
                        </div>
                    </div>
                `;
                console.error('解卦错误:', error);
            } finally {
                jieGuaBtn.disabled = false;
            }
        });

        // ============================================================
        // 5. 复制与保存卦象解读
        // ============================================================
        function copyResult() {
            const text = window.__guaResultText;
            if (!text) {
                alert('暂无可复制的内容，请先释卦');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✅ 已复制到剪贴板');
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showToast('✅ 已复制到剪贴板'); }
            catch(e) { alert('复制失败，请手动复制'); }
            document.body.removeChild(ta);
        }

        function saveResult() {
            const text = window.__guaResultText;
            if (!text) {
                alert('暂无可保存的内容，请先释卦');
                return;
            }
            // 从 localStorage 取卦名做文件名
            let fileName = '卦象解读';
            try {
                const gua = JSON.parse(localStorage.getItem('currentGua') || '{}');
                if (gua.benGuaName && gua.bianGuaName) fileName = `${gua.benGuaName}_${gua.bianGuaName}`;
            } catch(e) {}
            const stamp = new Date().toISOString().slice(0,10);
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${fileName}_${stamp}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✅ 已保存为 ' + a.download);
        }

        function showToast(msg) {
            const old = document.getElementById('guaToast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.id = 'guaToast';
            t.textContent = msg;
            t.style.cssText = 'position:fixed;top:30px;left:50%;transform:translateX(-50%);background:rgba(60,40,25,0.92);color:#f6efe6;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.4);font-family:Georgia,serif;';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 1800);
        }

        // 暴露到全局作用域，供 onclick 调用
        window.copyResult = copyResult;
        window.saveResult = saveResult;

        // ============================================================
        // 4. 初始化
        // ============================================================
        const guaData = loadGuaData();
        displayGuaInfo(guaData);

        console.log('✅ 解卦页面已加载（含时间信息）');
        console.log('📊 当前卦象:', guaData);

        // 如果URL参数带有卦象数据（从起卦页面跳转过来）
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');
        if (encodedData) {
            try {
                const data = JSON.parse(decodeURIComponent(encodedData));
                localStorage.setItem('currentGua', JSON.stringify(data));
                displayGuaInfo(data);
            } catch(e) {}
        }
    })();
</script>
</body>
</html>
